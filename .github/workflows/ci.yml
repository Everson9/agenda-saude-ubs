name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Testes
        if: matrix.node == 20
        run: npm test
      # gate de cobertura: o Node 22 aceita os limites mínimos (linhas 80%, funções 80%, ramos 70%)
      - name: Testes com gate de cobertura
        if: matrix.node == 22
        run: npm run test:coverage
