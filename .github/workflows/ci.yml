name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Testes
        if: matrix.node == 20
        run: npm test
      # gate de cobertura: o Node 22 aceita os limites mínimos (linhas 80%, funções 80%, ramos 70%)
      - name: Testes com gate de cobertura
        if: matrix.node == 22
        run: npm run test:coverage

  desempenho:
    # RNF01: o script sai com erro se algum fluxo passar de 300 ms no p95 com 5.000 agendamentos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run perf

  acessibilidade:
    # axe-core (WCAG 2.1 A/AA) + percurso por teclado no Chrome que já vem no runner do Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run a11y

  seguranca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o Gitleaks varre o histórico inteiro, não só o último commit
      - name: Gitleaks (segredos vazados)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (dependências vulneráveis)
        run: npm audit --audit-level=high
